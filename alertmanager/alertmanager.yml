global:
  resolve_timeout: 5m

route:
  receiver: default
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  # Empty by default so the stack starts without any external account.
  # Uncomment one block below and fill in your details to actually get notified.
  - name: default

    # Slack. Set SLACK_WEBHOOK_URL in your .env, then uncomment.
    # slack_configs:
